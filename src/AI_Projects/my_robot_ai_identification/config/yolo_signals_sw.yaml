object_detection:
  ros__parameters:
    modelYolo: yolov8n_custom.pt
    topic: /rubot/camera1/image_raw
    twist_frequency: 20.0
    front_distance: 0.3

    # Frames for TF
    sign_frame: map
    base_frame: base_link   # or base_footprint
    
    sign_positions:
      #Izquierda: [0.5, -0.5]
      STOP: [0.5, -0.5]
      # Ceda: [0.5, -0.5]
      # Derecha: [0.5, -0.5]
      # Prohibido: [0.5, -0.5]
