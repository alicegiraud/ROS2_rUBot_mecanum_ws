object_detection:
  ros__parameters:
    modelYolo: yolov8n_custom.pt
    topic: /image_raw
    twist_frequency: 20.0
    front_distance: 0.3

    # Coordinates MUST be in the same frame used for distance checks.
    # If you compare against /odom, these must be in odom.
    sign_positions:
      Izquierda: [0.5, -0.5]
      # STOP: [0.5, -0.5]
      # Ceda: [0.5, -0.5]
      # Derecha: [0.5, -0.5]
      # Prohibido: [0.5, -0.5]
